<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni Web Server</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-48x48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #f5f7fa; --panel: #ffffff; --panel-2: #f0f3f7; --border: #dfe4ea; --text: #1d2733; --muted: #64707d;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #b45309; --warn-bg: #fff7e6; --err: #dc2626; --err-bg: #fdecec;
  --on: #2563eb; --off: #c3cbd4; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --panel: #161d25; --panel-2: #1c252f; --border: #2a3542; --text: #e3e9ef; --muted: #8d99a6;
    --accent: #3b82f6; --accent-text: #ffffff; --ok: #22c55e; --warn: #f59e0b; --warn-bg: #2a2111; --err: #f87171; --err-bg: #2c1618;
    --on: #3b82f6; --off: #3a4654; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --panel: #161d25; --panel-2: #1c252f; --border: #2a3542; --text: #e3e9ef; --muted: #8d99a6;
  --accent: #3b82f6; --accent-text: #ffffff; --ok: #22c55e; --warn: #f59e0b; --warn-bg: #2a2111; --err: #f87171; --err-bg: #2c1618;
  --on: #3b82f6; --off: #3a4654; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
header { background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--muted); padding: 7px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active { background: var(--panel-2); color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h2 { font-size: 15px; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
h2 .spacer { flex: 1; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.pad { padding: 14px 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.svc { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.svc .top { display: flex; align-items: center; gap: 8px; }
.svc .name { font-weight: 600; font-size: 15px; }
.svc .meta { color: var(--muted); font-size: 12.5px; }
.svc .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.dot.running { background: var(--ok); }
.dot.starting, .dot.restarting, .dot.stopping { background: var(--warn); }
.dot.failed { background: var(--err); }
.state { font-size: 12px; color: var(--muted); }
button.btn, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--err); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.notice { padding: 10px 14px; border-radius: 8px; margin: 0 0 8px; font-size: 13px; border: 1px solid transparent; }
.notice.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.notice.info { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice.info .spacer { flex: 1; }
.notice.error { background: var(--err-bg); color: var(--err); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; background: var(--panel-2); }
tr:last-child td { border-bottom: 0; }
td.path { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); font-weight: 600; }
.badge.laravel { color: #ef4444; border-color: color-mix(in srgb, #ef4444 40%, transparent); }
.badge.symfony, .badge.wordpress, .badge.codeigniter { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.switch { position: relative; width: 36px; height: 20px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 99px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--on); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:disabled + span { opacity: .55; cursor: default; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=text], input[type=number], input[type=password], input[type=email] { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); min-width: 0; }
input[type=text].wide { width: 100%; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.exts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 14px; }
.ext { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.ext .n { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.php-card { margin-bottom: 14px; }
.php-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.php-head .v { font-weight: 700; font-size: 16px; }
.section-title { font-weight: 600; font-size: 13px; margin: 14px 0 8px; }
.kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(100px, 1fr) auto; gap: 6px; align-items: center; max-width: 640px; }
pre.log { margin: 0; padding: 12px 14px; max-height: 65vh; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
.task { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: 0; }
.progress { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .3s; }
.progress.indet div { width: 30% !important; animation: indet 1.2s infinite ease-in-out; }
@keyframes indet { from { margin-left: -30%; } to { margin-left: 100%; } }
.form-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 16px; align-items: center; max-width: 760px; }
.form-grid label { font-weight: 500; }
.hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow: auto; }
dialog h3 { margin: 0; font-size: 16px; }
dialog ol.steps { margin: 0; padding-left: 20px; max-height: 42vh; overflow: auto; font-size: 13px; }
dialog ol.steps li { margin-bottom: 6px; }
.np-panel { margin-bottom: 14px; padding: 0; }
.np-panel form { display: flex; flex-direction: column; }
.np-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.np-grid { padding: 16px; max-width: none; grid-template-columns: 160px minmax(0, 640px); align-items: start; }
.np-grid > label, .np-grid > span { padding-top: 7px; font-weight: 500; }
.np-panel .notice { margin: 0 16px 12px; }
.np-foot { padding: 12px 16px; border-top: 1px solid var(--border); gap: 8px; }
@media (max-width: 640px) { .np-grid { grid-template-columns: minmax(0, 1fr); } .np-grid > label, .np-grid > span { padding-top: 0; } }
.import-src { margin-bottom: 12px; padding: 0; overflow: hidden; }
.import-head { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.import-head:hover { background: var(--panel-2); }
.import-head .name { font-weight: 600; }
.import-head .chev { width: 12px; color: var(--muted); }
.import-body { border-top: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pick-col { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pick-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel-2); font-size: 13px; }
.pick-list { max-height: 320px; overflow: auto; padding: 4px 0; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.pick-row:hover { background: var(--panel-2); }
.pick-row.done { color: var(--muted); cursor: default; }
.pick-row.done:hover { background: none; }
.pick-row .badge { margin-left: auto; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; }
button.link:hover { text-decoration: underline; }
dialog.wide { width: min(680px, calc(100vw - 32px)); }
#task-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow: auto; }
ul.tsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
ul.tsteps li { display: flex; gap: 10px; align-items: center; }
ul.tsteps li.pending { color: var(--muted); }
ul.tsteps li.running { font-weight: 600; }
ul.tsteps li.failed { color: var(--err); font-weight: 600; }
ul.tsteps .ico { width: 18px; height: 18px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; border: 2px solid var(--border); }
ul.tsteps li.done .ico { background: var(--ok); border-color: var(--ok); color: #fff; }
ul.tsteps li.failed .ico { background: var(--err); border-color: var(--err); color: #fff; }
ul.tsteps li.running .ico { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
pre.tlog { margin: 0; background: var(--panel-2); border-radius: 8px; padding: 10px; font-size: 11.5px; line-height: 1.45; height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
@media (prefers-reduced-motion: reduce) { ul.tsteps li.running .ico { animation: none; border-top-color: var(--accent); } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.toast.error { background: var(--err); color: #fff; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
@media (max-width: 720px) {
  .form-grid { grid-template-columns: 1fr; gap: 4px 0; }
  .form-grid > div { margin-bottom: 10px; }
  .kv { grid-template-columns: 1fr 1fr auto; }
  td.path { max-width: 160px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><img src="/favicon-48x48.png" width="24" height="24" alt="">Omni Web Server</div>
    <nav id="nav">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="php">PHP</button>
      <button data-tab="tools">Tools</button>
      <button data-tab="import" id="nav-import" hidden>Import</button>
      <button data-tab="logs">Logs</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="spacer"></div>
    <div class="row" id="global-actions"></div>
  </div>
</header>
<main>
  <div id="notices"></div>
  <div id="tasks"></div>
  <section id="tab-overview"></section>
  <section id="tab-php" hidden></section>
  <section id="tab-tools" hidden></section>
  <section id="tab-import" hidden></section>
  <section id="tab-logs" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<dialog id="task-dlg" class="wide"><div id="task-body"></div></dialog>

<script>
"use strict";
let S = null;            // last /api/state
let tab = "overview";
let busy = false;
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "X-Omni": "1", "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, isErr) {
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " error" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 7000 : 2500);
}

// act runs an API call, shows errors, then refreshes the state.
async function act(method, path, body, okMsg) {
  try {
    busy = true;
    document.body.style.cursor = "progress";
    const r = await api(method, path, body);
    if (okMsg) toast(okMsg);
    return r;
  } catch (e) {
    toast(e.message, true);
    throw e;
  } finally {
    busy = false;
    document.body.style.cursor = "";
    await refresh(true);
  }
}

function hostURL(host, plain) {
  if (S.settings.ssl && S.ssl.ca && !S.ssl.error && !plain) {
    const p = S.settings.https_port;
    return "https://" + host + (p === 443 ? "" : ":" + p) + "/";
  }
  const p = S.settings.http_port;
  return "http://" + host + (p === 80 ? "" : ":" + p) + "/";
}

// ---------- rendering ----------
function renderGlobal() {
  const anyRunning = S.services.some(s => s.status.state === "running");
  $("#global-actions").innerHTML = `
    ${S.platform === "windows" && !S.admin ? `<span class="badge" title="The hosts file needs administrator rights; you will get a UAC prompt when it changes.">not admin</span>` : ""}
    <button class="btn primary" data-act="start-all">${anyRunning ? "Restart all" : "Start all"}</button>
    <button class="btn" data-act="stop-all">Stop all</button>`;
}

function updateDismissed(v) { try { return localStorage.getItem("omni-update-later") === v; } catch (e) { return false; } }

function renderNotices() {
  const u = S.update || {};
  const banner = u.available && !updateDismissed(u.version) ? `<div class="notice info">
      <span><strong>Omni Web Server ${esc(u.version)}</strong> is available (you have ${esc(S.version)}).</span><span class="spacer"></span>
      <a class="btn small primary" href="${esc(u.url)}" target="_blank" rel="noopener">What's new &amp; download</a>
      <button class="btn small" data-act="update-later">Later</button></div>` : "";
  $("#notices").innerHTML = banner + (S.warnings || []).map(w => `<div class="notice warn">${esc(w)}</div>`).join("");
  const tasks = S.tasks || [];
  $("#tasks").innerHTML = tasks.length ? `<div class="panel" style="margin-bottom:12px">${tasks.map(t => `
    <div class="task">
      <div class="row"><strong>${esc(t.title)}</strong>${t.steps ? `<button class="btn small" data-task-open="${t.id}" data-site="${esc((t.title.match(/^Create (.+) \(/) || [])[1] || "")}">Details</button>` : ""}<span class="muted small">${esc(t.status === "running" ? t.message : t.status === "done" ? (t.message || "Done") : "Failed")}</span></div>
      ${t.status === "running" ? `<div class="progress ${t.progress < 0 ? "indet" : ""}"><div style="width:${Math.max(0, t.progress) * 100}%"></div></div>` : ""}
      ${t.error ? `<div class="err">${esc(t.error)}</div>` : ""}
    </div>`).join("")}</div>` : "";
}

function svcCard(s) {
  const st = s.status.state;
  const running = st === "running" || st === "starting" || st === "restarting";
  let body;
  if (!s.installed) {
    const comp = s.name;
    const buttons = {
      mysql: `<button class="btn primary" data-install="mysql">Install MySQL 8.4</button><button class="btn" data-install="mariadb">Install MariaDB 11.4</button>`,
      apache: `<button class="btn primary" data-install="apache">Install Apache</button>`,
      mailpit: `<button class="btn primary" data-install="mailpit">Install Mailpit</button>`,
      redis: `<button class="btn primary" data-install="redis">Install Redis</button>`,
    };
    const blurb = { mailpit: "Catches every email your apps send, with a web inbox.", redis: "Cache, queues and sessions for Laravel." }[s.name];
    body = `<div class="meta">Not installed${blurb ? " · " + esc(blurb) : ""}</div>
      <div class="actions">
        ${S.platform === "windows" ? buttons[s.name] : `<span class="muted small">Install it with your package manager; Omni Web Server detects it on first run.</span>`}
        <button class="btn" data-install-url="${comp}">From URL…</button>
      </div>`;
  } else {
    body = `<div class="meta">${esc(s.version || "")} · ${s.info ? esc(s.info) : "port " + s.port}${s.status.pid ? " · PID " + s.status.pid : ""}</div>
      <div class="actions">
        ${running ? `<button class="btn" data-svc="${s.name}" data-a="restart">Restart</button><button class="btn" data-svc="${s.name}" data-a="stop">Stop</button>`
                  : `<button class="btn primary" data-svc="${s.name}" data-a="start">Start</button>`}
        ${s.url && st === "running" ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open inbox</a>` : ""}
        <button class="btn" data-log="${{ mysql: "mysql_error", apache: "apache_error" }[s.name] || s.name}">Log</button>
      </div>`;
  }
  return `<div class="panel svc">
    <div class="top"><span class="dot ${esc(st)}"></span><span class="name">${esc(s.title)}</span><span class="state">${s.installed ? esc(st) : ""}</span></div>
    ${body}
    ${s.status.error ? `<div class="err">${esc(s.status.error)}</div>` : ""}
  </div>`;
}

function phpCard() {
  const vs = S.php || [];
  return `<div class="panel svc">
    <div class="top"><span class="dot ${vs.some(p => p.running) ? "running" : ""}"></span><span class="name">PHP</span><span class="state">${vs.length} version${vs.length === 1 ? "" : "s"}</span></div>
    ${vs.length ? vs.map(p => `<div class="meta">${p.default ? "★ " : ""}<strong>${esc(p.minor)}</strong> ${esc(p.version)} · ${p.in_use ? `${p.running}/${p.workers} workers · port ${p.port}` : "not in use"}</div>`).join("")
                : `<div class="meta">No PHP installed</div>`}
    <div class="actions"><button class="btn" data-goto="php">Manage PHP</button></div>
  </div>`;
}

function phpOptions(selected) {
  const def = S.settings.default_php;
  return `<option value="" ${selected === "" ? "selected" : ""}>Default${def ? " (" + esc(def) + ")" : ""}</option>` +
    (S.php || []).map(p => `<option value="${esc(p.minor)}" ${selected === p.minor ? "selected" : ""}>PHP ${esc(p.minor)}</option>`).join("");
}

function renderOverview(force) {
  const el = $("#tab-overview");
  if (!force && el.contains(document.activeElement) && (document.activeElement.tagName === "SELECT" || (npPanel && npPanel.contains(document.activeElement)))) return;
  const sites = S.sites || [];
  el.innerHTML = `
    <div class="grid">${S.services.map(svcCard).join("")}${phpCard()}</div>
    <h2>Projects <span class="muted small" style="font-weight:400">${esc(S.settings.www_dir)}</span><span class="spacer"></span>
      <button class="btn small" data-act="rescan">Rescan</button>
      ${npOpen ? "" : `<button class="btn small primary" data-act="new-project">New project</button>`}
      <button class="btn small" data-act="add-site">Add vhost…</button></h2>
    <div id="np-slot"></div>
    <div class="panel table-wrap">
      ${sites.length ? `<table>
        <thead><tr><th style="width:64px">Vhost</th><th>Project</th><th>URL</th><th>PHP</th><th>Document root</th><th></th></tr></thead>
        <tbody>${sites.map(siteRow).join("")}</tbody>
      </table>` : `<div class="empty">No projects yet. Create a folder in <code>${esc(S.settings.www_dir)}</code> and it appears here${S.settings.auto_vhost ? " with a vhost already enabled" : ""}.</div>`}
    </div>

function siteRow(s) {

    <td>${s.enabled && !s.missing ? `<a href="${esc(hostURL(s.host))}" target="_blank" rel="noopener">${S.settings.ssl && S.ssl.ca && !S.ssl.error ? lockIcon() : ""}${esc(s.host)}</a>` : `<span class="muted">${esc(s.host)}</span>`}</td>

function lockIcon() {

let phpFilter = "";
function renderPHP(force) {

    ${vs.length ? `<p class="muted small"><code>php</code>, <code>php83</code>, … in any terminal use the same php.ini as the web server (see the Tools tab).</p>` : ""}`;
  const f = $("#ext-filter-" + CSS.escape(window._phpFilterFocus || ""), el);

function phpVersionCard(p) {
  const shown = p.extensions.filter(e => !phpFilter || e.name.includes(phpFilter));
  const toggles = shown.filter(e => !e.builtin), builtin = shown.filter(e => e.builtin);
  const ini = Object.entries(p.ini || {});
  return `<div class="panel php-card">
    <div class="php-head">
      <span class="v">PHP ${esc(p.minor)}</span><span class="muted">${esc(p.version)}</span>
      ${p.default ? `<span class="badge">default</span>` : `<button class="btn small" data-php-default="${esc(p.minor)}">Make default</button>`}
      <span class="badge">${p.in_use ? `${p.running}/${p.workers} workers running` : "not in use"}</span>
      <span class="spacer" style="flex:1"></span>
      <label class="small muted">Workers <input type="number" min="1" max="9" value="${p.workers}" style="width:60px" data-php-workers="${esc(p.minor)}"></label>
      ${p.extensions.some(e => e.name === "xdebug") ? "" : `<button class="btn small" data-install="xdebug" data-version="${esc(p.minor)}">Install Xdebug</button>`}
      <button class="btn small" data-log="php${esc(p.minor.replace(".", ""))}_error">Error log</button>
      ${p.removable ? `<button class="btn small danger" data-php-remove="${esc(p.minor)}">Uninstall</button>` : ""}
    </div>
    <div class="pad">
      ${(p.warnings || []).map(w => `<div class="notice warn">${esc(w)}</div>`).join("")}
      <div class="muted small mono" style="word-break:break-all">${esc(p.path)}<br>php.ini: ${esc(p.ini_path)}</div>
      <div class="section-title row">Extensions <input type="text" placeholder="Filter…" value="${esc(phpFilter)}" id="ext-filter-${esc(p.minor)}" data-ext-filter="${esc(p.minor)}" style="width:160px;font-weight:400"></div>
      <div class="exts">${toggles.map(e => `
        <label class="ext"><span class="switch"><input type="checkbox" data-ext="${esc(e.name)}" data-minor="${esc(p.minor)}" ${e.enabled ? "checked" : ""}><span></span></span><span class="n">${esc(e.name)}</span></label>`).join("") || `<span class="muted small">No matching extensions.</span>`}
      </div>
      ${builtin.length ? `<div class="hint" style="margin-top:8px">Built in: ${builtin.map(e => esc(e.name)).join(", ")}</div>` : ""}
      <div class="section-title">php.ini settings</div>
      <div class="kv" data-ini="${esc(p.minor)}">
        ${ini.map(([k, v]) => iniRow(k, v)).join("")}
        ${iniRow("", "")}
      </div>
      <div class="row" style="margin-top:8px"><button class="btn small primary" data-ini-save="${esc(p.minor)}">Save settings</button>
        <span class="hint">Defaults: ${Object.entries(p.ini_defaults || {}).filter(([k]) => !(k in (p.ini || {}))).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(", ")}</span></div>
    </div>
  </div>`;
}

function iniRow(k, v) {
  return `<input type="text" placeholder="key (e.g. memory_limit)" value="${esc(k)}" class="ini-k"><input type="text" placeholder="value" value="${esc(v)}" class="ini-v"><button class="btn small" data-ini-del title="Remove">×</button>`;
}

let toolsCache = null, importCache = [];

// loadImports looks for Laragon/XAMPP installs; the Import tab is shown only
// when there is something to import.
async function loadImports(fresh) {
  try { importCache = S.platform === "windows" ? await api("GET", "/api/migrate" + (fresh ? "?fresh=1" : "")) : []; } catch (e) { importCache = []; }
  $("#nav-import").hidden = !importCache.length;
  if (!importCache.length && tab === "import") showTab("overview");
}

// The Import tab: one expandable section per Laragon/XAMPP install, with the
// projects and databases to pick right in the page.
const importOpen = {};
let importTask = null;

const sameName = (list, n) => (list || []).some(d => d.toLowerCase() === n.toLowerCase());

function importPicker(i, title, kind, items, done) {
  const rows = items.map(n => sameName(done, n)
    ? `<label class="pick-row done"><input type="checkbox" disabled><span>${esc(n)}</span><span class="badge">imported</span></label>`
    : `<label class="pick-row"><input type="checkbox" data-pick="${kind}" value="${esc(n)}" checked><span>${esc(n)}</span></label>`).join("");
  return `<div class="pick-col">
    <div class="pick-head"><strong>${esc(title)}</strong><span class="spacer"></span>
      <button class="link" data-pick-all="${kind}" data-src="${i}">All</button><button class="link" data-pick-none="${kind}" data-src="${i}">None</button></div>
    <div class="pick-list">${rows || '<div class="muted small">None found.</div>'}</div>
  </div>`;
}

async function renderImport(fresh) {
  if (fresh) await loadImports(true);
  if (importCache.length === 1 && importOpen[0] === undefined) importOpen[0] = true;
  $("#tab-import").innerHTML = `
    <h2>Import existing projects<span class="spacer"></span><button class="btn small" data-act="import-rescan">Look again</button></h2>
    <p class="muted small">Omni Web Server found these local servers on this PC. Pick what to bring over; projects and databases that are already here are skipped, and the old install is not deleted.</p>
    ${importCache.map((s, i) => {
      const toProjects = s.projects.filter(n => !sameName(s.imported_projects, n)).length;
      const toDBs = s.databases.filter(n => !sameName(s.imported_databases, n)).length;
      const open = !!importOpen[i];
      return `<div class="panel import-src ${open ? "open" : ""}" id="imp-${i}">
        <button class="import-head" data-import-toggle="${i}" aria-expanded="${open}">
          <span class="chev">${open ? "▾" : "▸"}</span>
          <span class="name">${esc(s.name)}</span>
          <span class="mono small muted">${esc(s.root)}</span>
          <span class="spacer"></span>
          <span class="small muted">${toProjects} of ${s.projects.length} projects · ${toDBs} of ${s.databases.length} databases to import${s.php ? " · PHP " + esc(s.php) : ""}</span>
        </button>
        ${open ? `<div class="import-body">
          <div class="pick-grid">
            ${importPicker(i, "Projects", "project", s.projects, s.imported_projects)}
            ${importPicker(i, "Databases", "database", s.databases, s.imported_databases)}
          </div>
          <div class="form-grid" style="max-width:none">
            <label for="imp-pw-${i}">${esc(s.name)} MySQL password</label>
            <div><input type="password" id="imp-pw-${i}" autocomplete="off" placeholder="${s.has_password ? "detected automatically" : "none"}" style="width:260px">
              <div class="hint">Leave empty to use the ${s.has_password ? "detected password" : "default (no password)"}.</div></div>
          </div>
          <details><summary class="small">What the import does</summary><ol class="steps">${s.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>
          <div class="row">
            <span class="small muted" id="imp-count-${i}"></span><span class="spacer"></span>
            <button class="btn primary" data-import-run="${i}" ${importTask ? "disabled" : ""}>Import selected</button>
          </div>
        </div>` : ""}
      </div>`;
    }).join("")}`;
  Object.keys(importOpen).forEach(i => updateImportCount(+i));
}

function updateImportCount(i) {
  const box = $("#imp-" + i), out = $("#imp-count-" + i);
  if (!box || !out) return;
  const n = kind => box.querySelectorAll(`input[data-pick="${kind}"]:checked`).length;
  const p = n("project"), d = n("database");
  out.textContent = p || d ? `${p} project(s) and ${d} database(s) will be imported.` : "Nothing selected.";
  const btn = box.querySelector("[data-import-run]");
  if (btn) btn.disabled = !!importTask || !(p || d);
}

async function runImport(i) {
  const s = importCache[i], box = $("#imp-" + i);
  const picked = kind => [...box.querySelectorAll(`input[data-pick="${kind}"]:checked`)].map(c => c.value);
  const body = { kind: s.kind, root: s.root, projects: picked("project"), databases: picked("database") };
  const pw = $("#imp-pw-" + i).value;
  if (pw) body.password = pw;
  const task = await act("POST", "/api/migrate", body, "Import from " + s.name + " started");
  if (!task || !task.id) return;
  importTask = task.id;
  renderImport(false);
  // Progress shows at the top of the page; refresh the lists when it is done.
  const poll = setInterval(async () => {
    let t;
    try { t = await api("GET", "/api/tasks/" + importTask); } catch (e) { t = { status: "error" }; }
    if (t.status === "running") return;
    clearInterval(poll);
    importTask = null;
    if (tab === "import") renderImport(true); else loadImports(true);
  }, 2000);
}

let logName = "apache_error", logTimer = null;
async function renderLogs() {
  const el = $("#tab-logs");

  if (!names.includes(logName) && names.length) logName = names[0];
  el.innerHTML = `
    <div class="row" style="margin:6px 0 12px">

    <div class="panel"><pre class="log" id="log-text">Loading…</pre></div>`;
  await loadLog();
}

async function loadLog() {
  const pre = $("#log-text");
  if (!pre) return;
  try {
    const r = await api("GET", "/api/logs/" + enc(logName) + "?lines=500");
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    pre.textContent = r.text || "(empty)";
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch (e) { pre.textContent = e.message; }
}

function dnsStatusHTML() {
  const d = S.dns, tld = esc(S.settings.tld);
  if (!d.running) return `<span class="err">Not running: ${esc(d.error || "starting…")}</span>`;
  let html = `<span class="dot running" style="display:inline-block;margin-right:6px"></span>Answering <code>*.${tld}</code> on <code>${esc(d.address)}</code>`;
  if (d.active) html += `<div class="hint">Windows routes only <code>.${tld}</code> lookups here (NRPT rule); all other DNS is unchanged.</div>`;
  else if (d.resolver === "nrpt") html += `<div class="hint">The Windows resolver rule is not in place yet. <button class="btn small" data-act="hosts-sync">Apply DNS rule</button> (asks for administrator rights)</div>`;
  else html += `<div class="hint">Point your resolver at it, e.g. dnsmasq <code>server=/${tld}/127.0.0.1#${S.settings.dns_port}</code>.</div>`;
  return html;
}

function sslStatusHTML() {
  const x = S.ssl;
  if (!S.settings.ssl && !x.ca) return "";
  let html = "";
  if (S.settings.ssl && !x.available) html += `<label>Status</label><div class="err">Apache has no mod_ssl, so HTTPS is unavailable.</div>`;
  else if (x.error) html += `<label>Status</label><div class="err">${esc(x.error)}</div>`;
  if (x.ca) {
    html += `<label>Local CA</label><div>
      ${x.trusted ? `<span class="dot running" style="display:inline-block;margin-right:6px"></span>Trusted by this PC`
                  : `<span class="dot failed" style="display:inline-block;margin-right:6px"></span>Not trusted yet: browsers will warn until you trust it.`}
      <div class="row" style="margin-top:8px">
        ${x.trusted ? "" : `<button class="btn primary small" data-act="ssl-trust">Trust certificate</button>`}
        <a class="btn small" href="/api/ssl/ca.crt" download>Download CA</a>
      </div>
      <div class="hint">Expires ${esc(x.expires)}. ${S.platform === "windows" ? "Trusting adds it to your Windows user certificate store, which Chrome and Edge use (Firefox too when security.enterprise_roots.enabled is on). " : ""}To test on a phone or another browser, install the downloaded CA there. Never share the private key in etc/ssl.</div>
    </div>`;
  }
  return html;
}

function render() {
  if (!S) return;
  renderGlobal();
  renderNotices();
  if (tab === "overview") renderOverview();
  if (tab === "php") renderPHP(false);
  if (tab === "tools" && !(document.activeElement && document.activeElement.tagName === "SELECT")) renderTools(false);
}

async function refresh(force) {
  if (busy && !force) return;
  try {
    S = await api("GET", "/api/state");
    render();
  } catch (e) {
    $("#notices").innerHTML = `<div class="notice error">Cannot reach Omni Web Server: ${esc(e.message)}. Is it still running?</div>`;

function showTab(name) {
  tab = name;
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b.dataset.tab === name);
  for (const s of document.querySelectorAll("main > section")) s.hidden = s.id !== "tab-" + name;
  if (name === "overview") renderOverview();
  if (name === "php") renderPHP(true);
  if (name === "tools") renderTools(true);
  if (name === "import") renderImport(false);
  if (name === "logs") renderLogs();
  if (name === "settings") renderSettings();
  try { localStorage.setItem("omni-tab", name); } catch (e) {}
}

function dialog(title, fieldsHTML, submitLabel) {
  return new Promise(resolve => {
    const dlg = $("#dlg"), form = $("#dlg-form");
    form.innerHTML = `<h3>${esc(title)}</h3>${fieldsHTML}
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${esc(submitLabel || "OK")}</button></div>`;
    dlg.onclose = () => {
      if (dlg.returnValue !== "ok") return resolve(null);
      const out = {};
      for (const el of form.querySelectorAll("[name]")) out[el.name] = el.type === "checkbox" ? el.checked : el.value.trim();
      resolve(out);
    };
    dlg.returnValue = "";

    const first = form.querySelector("input,select");
    if (first) first.focus();
  });
}

// phpOK mirrors the server's check of a Composer PHP constraint ("^8.2",
// ">=8.4", "^7.3|^8.0") against a PHP minor version such as "8.3".
function phpOK(constraint, minor) {
  if (!constraint) return true;
  const have = minor.split(".").map(Number).concat([99]);
  const cmp = (a, b) => { for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) - (b[i] || 0); return 0; };
  return constraint.split(/\s*\|\|?\s*/).some(alt => alt.replace(/,/g, " ").split(/\s+/).filter(Boolean).every(term => {
    const m = term.match(/^(\^|~|>=|<=|>|<)?(\d+(?:\.\d+)*)/);
    if (!m) return true;
    const v = m[2].split(".").map(Number), c = cmp(have, v);
    switch (m[1] || ">=") {
      case "^": case "~": return c >= 0 && have[0] === v[0];
      case ">=": return c >= 0;
      case ">": return c > 0;
      case "<": return c < 0;
      case "<=": return c <= 0;
    }
    return true;
  }));
}

const slugDB = s => s.toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 64);

// taskDialog follows a multi-step task (such as creating a project) in a
// modal: the steps with their state, the live command output and, at the end,
// buttons to open the result. Closing it leaves the task running.
let taskTimer = null;
function taskDialog(id, siteName, onFinish) {
  const dlg = $("#task-dlg");
  let follow = true, logOpen;
  const draw = t => {
    const running = t.status === "running";
    const icon = { done: "✓", failed: "✕" };
    const pre = $("#task-log"), det = $("#task-body details");
    if (pre) follow = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    if (det) logOpen = det.open;
    const openLog = logOpen === undefined ? (running || !!t.error) : logOpen || !!t.error;
    $("#task-body").innerHTML = `
      <h3 style="margin:0">${esc(t.title)}</h3>
      <div class="progress ${running && !t.steps ? "indet" : ""}"><div style="width:${Math.max(0, t.progress) * 100}%"></div></div>
      ${t.steps ? `<ul class="tsteps">${t.steps.map(s => `<li class="${s.status}"><span class="ico">${icon[s.status] || ""}</span>${esc(s.name)}</li>`).join("")}</ul>` : `<div class="small muted">${esc(t.message)}</div>`}
      ${t.error ? `<div class="notice error">${esc(t.error)}</div>` : ""}
      ${t.status === "done" ? `<div class="notice info"><span><strong>Ready.</strong> ${t.url ? `Your site is at <a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a>` : ""}</span></div>` : ""}
      <details ${openLog ? "open" : ""}><summary class="small muted">Output</summary><pre class="tlog" id="task-log">${esc((t.log || []).join("\n")) || "…"}</pre></details>
      <div class="row" style="justify-content:flex-end">
        ${running ? `<span class="small muted" style="margin-right:auto">You can close this window: the work goes on in the background.</span><button class="btn" data-task-close>Run in background</button>` : ""}
        ${t.status === "error" ? `<button class="btn" data-log-open="projects">Open the projects log</button><button class="btn primary" data-task-close>Close</button>` : ""}
        ${t.status === "done" ? `${siteName ? `<button class="btn" data-site-open="${esc(siteName)}" data-what="folder">Open folder</button>` : ""}<button class="btn" data-task-close>Close</button>${t.url ? `<a class="btn primary" href="${esc(t.url)}" target="_blank" rel="noopener">Open site</a>` : ""}` : ""}
      </div>`;
    const log = $("#task-log");
    if (log && follow) log.scrollTop = log.scrollHeight;
  };
  const tick = async () => {
    let t;
    try { t = await api("GET", "/api/tasks/" + id); } catch (e) { clearInterval(taskTimer); return; }
    draw(t);
    if (t.status !== "running") { clearInterval(taskTimer); refresh(true); if (onFinish) { const f = onFinish; onFinish = null; f(t); } }
  };
  clearInterval(taskTimer);
  dlg.onclose = () => clearInterval(taskTimer);
  $("#task-body").innerHTML = "";
  dlg.showModal();
  tick();
  taskTimer = setInterval(tick, 1000);
}

// The "New project" panel on the Overview tab: a form in the page (not a

let npPanel = null, npOpen = false;

async function toggleNewProject() {

async function buildNewProject() {
  const r = await api("GET", "/api/templates");
  const tpls = r.templates, gitOK = r.git;
  let dbs = null; // existing databases, when MySQL runs
  try { dbs = await api("GET", "/api/databases"); } catch (e) { dbs = null; }
  const phps = (S.php || []).map(p => p.minor);
  const defPHP = S.settings.default_php;
  const mysqlOK = (S.services.find(s => s.name === "mysql") || {}).installed;
  const row = (label, input, hint = "", id = "") => `<label${id ? ` id="${id}"` : ""}>${label}</label><div>${input}${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;

  npPanel = document.createElement("div");
  npPanel.className = "panel np-panel";
  npPanel.innerHTML = `<form id="np-form" novalidate>
    <div class="np-head"><strong>New project</strong><span class="spacer"></span><button type="button" class="btn small" data-act="new-project" aria-label="Close">✕</button></div>
    <div class="form-grid np-grid">
      ${row("Template", `<select name="template" class="wide">${tpls.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select>`, `<span id="np-desc"></span>`)}
      <span id="np-version-label">Version</span><div id="np-version"></div>
      ${row("Project name", `<input type="text" class="wide" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9._ -]{0,62}" placeholder="blog" autocomplete="off">`, `<span id="np-url">The folder in www and the site name.</span>`)}
      ${row("PHP version", phps.length ? `<select name="php">${phps.map(m => `<option ${m === defPHP ? "selected" : ""}>${esc(m)}</option>`).join("")}</select><div class="err small" id="np-php-warn"></div>`
        : `<input type="hidden" name="php" value=""><span class="err small">No PHP installed yet: install a version on the PHP tab first.</span><div class="err small" id="np-php-warn" hidden></div>`, "", "np-php-label")}
      <span id="np-db-label">Database</span><div id="np-db"></div>
      <div id="np-extra" style="display:contents"></div>
      ${row("Git", gitOK ? `<label class="row" style="gap:8px;font-weight:400"><input type="checkbox" name="git" checked> Initialize a Git repository (git init + first commit)</label>` : `<span class="muted small">Install Git from the Tools tab to start projects with a repository.</span>`)}
    </div>
    <div class="notice error" id="np-error" hidden></div>
    <div class="row np-foot"><span class="spacer"></span><button type="button" class="btn" data-act="new-project">Cancel</button><button type="submit" class="btn primary" id="np-create">Create project</button></div>
  </form>`;
  const form = npPanel.querySelector("#np-form"), $f = n => form.querySelector(`[name="${n}"]`), $p = sel => npPanel.querySelector(sel);
  let dbTouched = false;
  const tpl = () => tpls.find(x => x.id === $f("template").value);
  const host = name => name.toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");

  const check = () => {
    const t = tpl();
    const opt = $f("version")?.selectedOptions[0];
    const need = opt ? opt.dataset.php : "";
    $p("#np-php-warn").textContent = t.id !== "html" && need && !phpOK(need, $f("php").value) ? `This version needs PHP ${need}. Choose another PHP version, or install one on the PHP tab.` : "";
    const db = $f("database"), useDB = $f("use_db");
    const taken = db && !db.disabled && (!useDB || useDB.checked) && dbs && dbs.some(d => d.toLowerCase() === db.value.trim().toLowerCase());
    if ($p("#np-db-warn")) $p("#np-db-warn").textContent = taken ? `A database named ${db.value.trim()} already exists. Choose another name.` : "";
    const name = $f("name").value.trim();
    const siteTaken = name && (S.sites || []).some(s => s.name.toLowerCase() === name.toLowerCase());
    $p("#np-url").innerHTML = !name ? "The folder in www and the site name."
      : siteTaken ? `<span class="err">A project named ${esc(name)} already exists.</span>`
      : `${esc(S.settings.www_dir)}\\${esc(name)}  ·  http://${esc(host(name))}.${esc(S.settings.tld)}`;
    $p("#np-create").disabled = !!(taken || siteTaken || $p("#np-php-warn").textContent);
  };

  const update = () => {
    const t = tpl(), name = $f("name").value.trim();
    $p("#np-desc").textContent = t.description;
    const versions = t.error ? `<div class="notice warn">Could not load the versions: ${esc(t.error)}</div>`
      : t.versions.length ? `<select name="version" class="wide">${t.versions.map(v => `<option value="${esc(v.version)}" data-php="${esc(v.php || "")}">${esc(v.label)}${v.php ? " · PHP " + esc(v.php) : ""}</option>`).join("")}</select>` : "";
    $p("#np-version").innerHTML = versions;
    $p("#np-version-label").hidden = $p("#np-version").hidden = !versions;
    $p("#np-php-label").hidden = $p("#np-php-label").nextElementSibling.hidden = t.id === "html";
    const needDB = t.id === "wordpress";
    const dbHTML = !t.database ? "" : !mysqlOK ? `<span class="muted small">${needDB ? "WordPress needs MySQL: install it on the Overview tab first." : "Install MySQL on the Overview tab to create a database."}</span>`
      : `<label class="row" style="gap:8px;font-weight:400"><input type="checkbox" name="use_db" ${needDB || $f("use_db")?.checked !== false ? "checked" : ""} ${needDB ? "disabled" : ""}> Create a MySQL database</label>
         <input type="text" name="database" pattern="[A-Za-z0-9_$-]{1,64}" value="${esc($f("database")?.value || slugDB(name))}" autocomplete="off" style="width:260px;margin-top:6px">
         <div class="err small" id="np-db-warn"></div>
         <div class="hint">Uses the root user from <b>Settings → MySQL</b>.${dbs ? "" : " MySQL is not running, so existing names are checked when the project is created."}</div>`;
    $p("#np-db").innerHTML = dbHTML;
    $p("#np-db-label").hidden = $p("#np-db").hidden = !dbHTML;
    const keep = Object.fromEntries(["title", "admin_user", "admin_password", "admin_email"].map(n => [n, $f(n)?.value]));
    const extra = {
      laravel: () => row("App name", `<input type="text" class="wide" name="title" value="${esc(keep.title ?? name)}">`, "Goes into APP_NAME. The .env is filled in for the database, Mailpit and the site URL, and the migrations run."),
      symfony: () => row("Symfony", `<label class="row" style="gap:8px;font-weight:400"><input type="checkbox" name="webapp"> Full web app (Twig, Doctrine, forms, security…)</label>`),
      wordpress: () => row("Site title", `<input type="text" class="wide" name="title" value="${esc(keep.title ?? name)}">`) +
        row("Admin user", `<input type="text" name="admin_user" value="${esc(keep.admin_user ?? "admin")}" autocomplete="off" style="width:260px">`) +
        row("Admin password", `<input type="password" name="admin_password" value="${esc(keep.admin_password ?? "")}" autocomplete="new-password" style="width:260px">`) +
        row("Admin e-mail", `<input type="email" name="admin_email" value="${esc(keep.admin_email ?? "admin@example.com")}" style="width:260px">`, "Mail is caught by Mailpit, so any address works."),
      php: () => row("Page title", `<input type="text" class="wide" name="title" value="${esc(keep.title ?? name)}">`),
      html: () => row("Page title", `<input type="text" class="wide" name="title" value="${esc(keep.title ?? name)}">`),
    }[t.id.startsWith("laravel") ? "laravel" : t.id];
    $p("#np-extra").innerHTML = extra ? extra() : "";
    check();
  };

  form.addEventListener("change", e => {
    if (e.target.name === "template") update();
    if (e.target.name === "use_db") $f("database").disabled = !e.target.checked;
    check();
  });
  form.addEventListener("input", e => {
    if (e.target.name === "database") dbTouched = true;
    if (e.target.name === "name") {
      const name = e.target.value.trim();
      if (!dbTouched && $f("database")) $f("database").value = slugDB(name);
      if ($f("title")) $f("title").value = name;
    }
    check();
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = $p("#np-error");
    err.hidden = true;
    if (!form.reportValidity()) return;
    const t = tpl(), v = n => ($f(n) ? ($f(n).type === "checkbox" ? $f(n).checked : $f(n).value.trim()) : "");
    if (t.id === "wordpress" && !v("admin_password")) { err.textContent = "Enter a WordPress admin password."; err.hidden = false; return; }
    const body = { template: t.id, version: v("version"), name: v("name"), php: t.id === "html" ? "" : v("php"), title: v("title") || v("name"),
      database: t.database && mysqlOK && (t.id === "wordpress" || v("use_db")) ? v("database") : "",
      admin_user: v("admin_user"), admin_password: v("admin_password"), admin_email: v("admin_email"), webapp: !!v("webapp"), git: !!v("git") };
    let task;
    try { task = await api("POST", "/api/projects", body); } catch (ex) { err.textContent = ex.message; err.hidden = false; return; }
    taskDialog(task.id, body.name, async done => {
      if (done.status === "done") { npOpen = false; npPanel = null; renderOverview(true); return; }
      // Failed: the form keeps everything; refresh the database list so the
      // name check knows about leftovers, and show the error under the form.
      try { dbs = await api("GET", "/api/databases"); } catch (e) {}
      err.textContent = done.error + " Change what is needed and create the project again.";
      err.hidden = false;
      check();
    });
  });
  update();
}

// ---------- events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a[data-x]");
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.tab) return showTab(d.tab);
    if (d.goto) return showTab(d.goto);
    if (d.svc) { await act("POST", `/api/services/${d.svc}/${d.a}`); return; }
    if (d.install) return startInstall({ component: d.install, version: d.version || "" });
    if (d.share) {
      const on = d.on === "1";
      if (on) toast("Starting a Cloudflare tunnel…");
      const r = await act("POST", `/api/sites/${enc(d.share)}/share`, { on });
      if (on && r && r.url) { try { await navigator.clipboard.writeText(r.url); toast("Public URL copied: " + r.url); } catch (e) { toast(r.url); } }
      return;
    }
    if (d.installUrl) return installDialog(d.installUrl);
    if (d.importToggle !== undefined) { importOpen[d.importToggle] = !importOpen[d.importToggle]; return renderImport(false); }
    if (d.importRun !== undefined) return runImport(+d.importRun);
    if (d.pickAll || d.pickNone) {
      for (const c of document.querySelectorAll(`#imp-${d.src} input[data-pick="${d.pickAll || d.pickNone}"]`)) c.checked = !!d.pickAll;
      return updateImportCount(+d.src);
    }
    if (d.taskClose !== undefined) return $("#task-dlg").close();
    if (d.logOpen) { $("#task-dlg").close(); logName = d.logOpen; return showTab("logs"); }
    if (d.taskOpen) return taskDialog(+d.taskOpen, d.site || "");
    if (d.log) { logName = d.log; return showTab("logs"); }
    if (d.siteOpen) return act("POST", `/api/sites/${enc(d.siteOpen)}/open`, { what: d.what });
    if (d.siteRemove) { if (confirm(`Remove the vhost ${d.siteRemove}? The folder is not deleted.`)) await act("DELETE", `/api/sites/${enc(d.siteRemove)}`); return; }
    if (d.siteRoot) {
      const s = S.sites.find(x => x.name === d.siteRoot);
      const v = await dialog(`Document root of ${s.name}`, field("Folder (relative to the project, or absolute)", "docroot", `value="${esc(s.docroot_override)}" placeholder="auto (detected: ${esc(s.framework)})"`, "Leave empty to use the detected folder, e.g. <code>public</code> for Laravel."), "Save");
      if (v) await act("PATCH", `/api/sites/${enc(s.name)}`, { docroot: v.docroot }, "Document root updated");
      return;
    }
    if (d.phpDefault) return act("POST", "/api/php/default", { version: d.phpDefault }, "Default PHP is now " + d.phpDefault).then(() => renderPHP(true));
    if (d.phpRemove) { if (confirm(`Uninstall PHP ${d.phpRemove}? Its folder will be deleted.`)) await act("DELETE", `/api/php/${d.phpRemove}`).then(() => renderPHP(true)); return; }
    if (d.iniDel !== undefined) { const k = t.previousElementSibling.previousElementSibling; k.value = ""; t.previousElementSibling.value = ""; return; }
    if (d.iniSave) {
      const box = document.querySelector(`[data-ini="${CSS.escape(d.iniSave)}"]`);
      const ks = box.querySelectorAll(".ini-k"), vs = box.querySelectorAll(".ini-v");
      const ini = {};
      ks.forEach((k, i) => { if (k.value.trim()) ini[k.value.trim()] = vs[i].value.trim(); });
      const workers = parseInt(document.querySelector(`[data-php-workers="${CSS.escape(d.iniSave)}"]`).value, 10) || 0;
      await act("POST", `/api/php/${d.iniSave}/settings`, { ini, workers }, "PHP " + d.iniSave + " settings saved; workers restarted");
      return renderPHP(true);
    }
    switch (d.act) {
      case "start-all": return act("POST", "/api/services/all/restart", undefined, "Services started");
      case "stop-all": return act("POST", "/api/services/all/stop", undefined, "Services stopped");
      case "rescan": return act("POST", "/api/rescan");
      case "hosts-sync": return act("POST", "/api/hosts/sync", undefined, "Hosts file updated");
      case "ssl-trust": await act("POST", "/api/ssl/trust", undefined, "Certificate trusted. Reload your https:// tabs."); return renderSettings();
      case "new-project": return toggleNewProject();
      case "add-site": {
        const v = await dialog("Add a vhost for a folder outside www", `
          ${field("Name", "name", 'required placeholder="shop"', "Served at name." + esc(S.settings.tld))}
          ${field("Project folder (absolute path)", "path", 'required placeholder="D:\\\\projects\\\\shop"')}
          <label>PHP version<br><select name="php" class="wide">${phpOptions("")}</select></label>`, "Add");
        if (v) await act("POST", "/api/sites", v, "Added " + v.name);
        return;
      }
      case "php-install": return phpInstallDialog();
      case "php-add": {
        const v = await dialog("Add an existing PHP", field("PHP folder (with php-cgi) or php-cgi binary", "path", 'required'), "Add");
        if (v) await act("POST", "/api/php/add", v, "PHP added").then(() => renderPHP(true));
        return;
      }
      case "tools-refresh": return renderTools(true);
      case "node-version": {
        const v = await dialog("Install Node.js", field("Version", "version", 'required placeholder="22, 20.18.1 or lts"'), "Install");
        if (v) await startInstall({ component: "node", version: v.version });
        return;
      }
      case "root-pass": {
        const v = await dialog("Change MySQL root password", `<label>New password (empty for none)<br><input type="password" class="wide" name="password"></label>`, "Change");
        if (v) { await act("POST", "/api/mysql/password", v, "Root password changed"); await refresh(true); if (tab === "settings") renderSettings(); }
        return;
      }
      case "log-refresh": return loadLog();
      case "import-rescan": return renderImport(true);
      case "update-later": {
        try { localStorage.setItem("omni-update-later", S.update.version); } catch (e) {}
        return renderNotices();
      }
      case "update-check": {
        S.update = await api("POST", "/api/update/check");
        renderNotices();
        return renderSettings();
      }
      case "save-settings": {
        await act("POST", "/api/settings", { tld: $("#s-tld").value, www_dir: $("#s-www").value }, "Settings saved");
        return renderSettings();
      }
      case "save-ports": {
        await act("POST", "/api/settings", { http_port: +$("#s-http").value, https_port: +$("#s-https").value, mysql_port: +$("#s-mysql").value, dns_port: +$("#s-dns").value, dashboard_port: +$("#s-dash").value }, "Ports saved");
        return renderSettings();
      }
      case "quit": if (confirm("Stop all services and quit Omni Web Server?")) await api("POST", "/api/quit"); return;
    }
  } catch (err) { /* reported by act() */ }
});

document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  try {
    if (d.siteToggle) return act("PATCH", `/api/sites/${enc(d.siteToggle)}`, { enabled: t.checked }, `${d.siteToggle}: vhost ${t.checked ? "enabled" : "disabled"}`);
    if (d.sitePhp !== undefined) { t.blur(); return act("PATCH", `/api/sites/${enc(d.sitePhp)}`, { php: t.value }, `${d.sitePhp} now uses PHP ${t.value || "default"}`); }
    if (d.ext) { await act("POST", `/api/php/${d.minor}/extensions`, { name: d.ext, enabled: t.checked }, `${d.ext} ${t.checked ? "enabled" : "disabled"} for PHP ${d.minor}`); return renderPHP(true); }
    if (d.setting) { await act("POST", "/api/settings", { [d.setting]: t.checked }, "Saved"); return tab === "tools" ? renderTools(false) : renderSettings(); }
    if (d.nodeDefault !== undefined) { await act("POST", "/api/node/default", { version: t.value }, "Default Node.js: " + t.value); return renderTools(false); }
    if (t.id === "log-name") { logName = t.value; return loadLog(); }
    if (t.id === "log-follow") { clearInterval(logTimer); logTimer = t.checked ? setInterval(loadLog, 2000) : null; }
  } catch (err) {}
});

document.addEventListener("change", e => {
  if (e.target.dataset.pick) {
    const box = e.target.closest(".import-src");
    if (box) updateImportCount(+box.id.slice(4));
  }
});

document.addEventListener("input", e => {
  if (e.target.dataset.extFilter !== undefined) {
    phpFilter = e.target.value.toLowerCase();
    window._phpFilterFocus = e.target.dataset.extFilter;
    renderPHP(true);
  }
});


(async () => {
  await refresh(true);
  await loadImports(false);
  let saved = "overview";
  try { saved = localStorage.getItem("omni-tab") || "overview"; } catch (e) {}
  const tabs = ["overview", "php", "tools", "logs", "settings"].concat(importCache.length ? ["import"] : []);
  showTab(tabs.includes(saved) ? saved : "overview");
  setInterval(() => refresh(false), 2000);
})();
</script>
</body>
</html>
